spring.application.name=FixFirst
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fixfirst}
spring.datasource.username=${DB_USER:fixfirst_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
fixfirst.admin.email=${ADMIN_EMAIL:admin@fixfirst.local}
fixfirst.admin.password=${ADMIN_PASSWORD}
fixfirst.photo-dir=${FIXFIRST_PHOTO_DIR:./fixfirst-photos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
fixfirst.replacement.repair-count-threshold=${FIXFIRST_REPAIR_COUNT_THRESHOLD:3}
fixfirst.replacement.cost-ratio=${FIXFIRST_REPAIR_COST_RATIO:0.60}
